name: Build installers

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/python -m pip install -r requirements.txt 'pyinstaller>=6,<7'
      - run: PATH="$PWD/.venv/bin:$PATH" sh packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Simon-Debian
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6,<7'
      - shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Simon-Windows
          path: dist/windows/Simon-Setup-*.exe